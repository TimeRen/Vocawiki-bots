name: Update the contributions navbox on User:人间百态

# 这是 Toolforge 上 `contributions` 任务的 GitHub Actions 兜底（Toolforge 故障时顶上）。
#
# 需要先在本仓库 Settings > Secrets and variables > Actions 里添加：
#   USER_PASSWORD_PY = user-password.py 的完整内容（写法与 update-vocaloid-collection 相同）
#   VOCA_USERNAME（可选）= voca.wiki 上的机器人账号名
#
# 触发方式：
#   · schedule 每小时 :23；Toolforge 的 contributions 在 :53， hourly 在 :17（GitHub 在 :47），
#     四处错开
#   · push 到 main 且改动到脚本或本工作流 -> 立即运行
#   · workflow_dispatch -> Actions 页面手动 Run workflow
#   · repository_dispatch -> 外部心跳即时触发：
#       curl -X POST -H "Authorization: ******" \
#            -H "Accept: application/vnd.github+json" \
#            https://api.github.com/repos/TimeRen/Vocawiki-bots/dispatches \
#            -d '{"event_type":"update-contributions"}'

on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'bots/user_contributions_navbox.py'
      - '.github/workflows/update-contributions.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [update-contributions]

concurrency:
  group: contributions-navbox
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # 一轮只查几次 API（usercontribs + 两批 info），正常一分钟内结束
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      VOCA_USERNAME: ${{ secrets.VOCA_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pywikibot
        run: pip install --disable-pip-version-check pywikibot

      - name: Write user-password.py
        env:
          USER_PASSWORD_PY: ${{ secrets.USER_PASSWORD_PY }}
        run: |
          if [ -z "$USER_PASSWORD_PY" ]; then
            echo "::error::请先在仓库 Secrets 中配置 USER_PASSWORD_PY"
            exit 1
          fi
          printf '%s\n' "$USER_PASSWORD_PY" > user-password.py
          chmod 600 user-password.py

      - name: Update the navbox
        run: python bots/user_contributions_navbox.py --write
