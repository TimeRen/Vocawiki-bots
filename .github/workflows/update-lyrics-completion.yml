name: Update the VOCALOID lyrics wiki completion plan

# 这是 Toolforge 上 `lyrics-plan` 任务的 GitHub Actions 兜底（Toolforge 故障时顶上）。
#
# 需要先在本仓库 Settings > Secrets and variables > Actions 里添加：
#   USER_PASSWORD_PY = user-password.py 的完整内容（写法与 update-vocaloid-collection 相同）：
#     · 普通密码：      ('Renjian-bot', '账号密码')
#     · 机器人密码(推荐)：('Renjian-bot', BotPassword('后缀', '机器人密码'))
#   VOCA_USERNAME（可选）= voca.wiki 上的机器人账号名
#
# 与 update-vocaloid-collection 不同的是：这个任务**必须**跨运行保留 data/ 下的缓存
# （AtWiki 页面清单、voca 歌名索引、逐页判定）。没有缓存时要把几千个 AtWiki 页面
# 重新抓一遍；用 actions/cache 恢复上一次运行留下的 data/，AtWiki 清单用 --max-age
# 允许 25 小时内直接复用。实测（2026-10-21，冷缓存）：清单 23 秒、歌名索引 2.5 分钟、
# 逐页判定 3.4 分钟，整轮约 6.5 分钟。
#
# 注意 --max-age 只管 **AtWiki 页面清单**。歌名索引有自己的 1 小时 TTL（--index-max-age），
# 缓存旧了会先用 list=recentchanges 增量补齐：本工作流的实际间隔正好 ~24 小时，
# 以前索引跟着 25 小时复用，于是每轮都在用昨天的索引，把前一天刚建的条目当成
# 「还没有条目」（rev 277313 把 AGE / Sr.Wonderland 加回来就是这个原因）。
#
# 触发方式：
#   · schedule 每天 05:13 UTC；Toolforge 的 lyrics-plan 在 04:23 UTC，两处错开
#   · push 到 main 且改动到脚本或本工作流 -> 立即运行（改完即可验证）
#   · workflow_dispatch -> Actions 页面手动 Run workflow
#   · repository_dispatch -> 外部心跳即时触发：
#       curl -X POST -H "Authorization: ******" \
#            -H "Accept: application/vnd.github+json" \
#            https://api.github.com/repos/TimeRen/Vocawiki-bots/dispatches \
#            -d '{"event_type":"update-lyrics-completion"}'

on:
  schedule:
    - cron: '13 5 * * *'
  push:
    branches: [main]
    paths:
      - 'bots/vocaloid_lyrics_completion.py'
      - '.github/workflows/update-lyrics-completion.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [update-lyrics-completion]

concurrency:
  group: lyrics-completion
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # 冷缓存一轮约 7 分钟（实测 2026-10-21：清单 23s、索引 2.5min、判定 3.4min）；
    # 网络变慢或首次判定大量页面时给足余量
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      VOCA_USERNAME: ${{ secrets.VOCA_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pywikibot
        run: pip install --disable-pip-version-check pywikibot

      - name: Write user-password.py
        env:
          USER_PASSWORD_PY: ${{ secrets.USER_PASSWORD_PY }}
        run: |
          if [ -z "$USER_PASSWORD_PY" ]; then
            echo "::error::请先在仓库 Secrets 中配置 USER_PASSWORD_PY"
            exit 1
          fi
          printf '%s\n' "$USER_PASSWORD_PY" > user-password.py
          chmod 600 user-password.py

      - name: Restore the AtWiki / voca.wiki caches
        # 丢了这份缓存也不会写错页面（抓不到来源时机器人直接放弃本轮），只是慢
        uses: actions/cache@v4
        with:
          path: data
          key: voca-lyrics-cache-${{ github.run_id }}
          restore-keys: voca-lyrics-cache-

      - name: Update the completion plan
        run: |
          # --max-age 25 小时：每天跑一次时直接复用上一次的 AtWiki 页面清单；
          # 歌名索引不跟着走 25 小时——它 1 小时就过期，旧了先用 recentchanges
          # 补上新建 / 移动过的条目（补不动再整体重建）。Toolforge 上两个值都是默认。
          python bots/vocaloid_lyrics_completion.py --write --max-age 90000
