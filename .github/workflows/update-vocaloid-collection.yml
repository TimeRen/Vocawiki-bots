name: Update VOCALOID Collection contribution list

# 需要先在本仓库 Settings > Secrets and variables > Actions 里添加：
#   USER_PASSWORD_PY = user-password.py 的完整内容。
#     · 普通密码：      ('Renjian-bot', '账号密码')
#     · 机器人密码(推荐)：('Renjian-bot', BotPassword('后缀', '机器人密码'))
#         —— 后缀就是 Special:BotPasswords 里那行 "Renjian-bot@后缀" 中 @ 后面的部分；
#            这里只写后缀，不要写 "Renjian-bot@后缀"。
#   VOCA_USERNAME（可选）= voca.wiki 上的机器人账号名；不设则用 user-config.py 里的默认值 Renjian-bot
# user-config.py 已经提交在仓库里（family_files['voca'] 指向 https://voca.wiki/api.php）。
#
# 触发方式：
#   · push 到 main 且改动到机器人脚本或本工作流 -> 立即运行（改完即可验证）
#   · schedule 每小时运行一次完整维护（UTC 分钟 47）；Toolforge 在分钟 17 运行，
#     两处错开，且都不依赖 recentchanges 增量列表
#   · workflow_dispatch -> Actions 页面手动 Run workflow
#   · repository_dispatch -> 外部心跳（自建 VPS / cron 服务）即时触发：
#       curl -X POST -H "Authorization: Bearer <PAT>" \
#            -H "Accept: application/vnd.github+json" \
#            https://api.github.com/repos/TimeRen/Vocawiki-bots/dispatches \
#            -d '{"event_type":"update-vocaloid-collection"}'
# Actions 与 Toolforge 都是单次定时运行，不会常驻轮询。

on:
  schedule:
    # 每小时一次；与 Toolforge 的 :17 错开
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - 'bots/vocaloid_collection_contributions.py'
      - '.github/workflows/update-vocaloid-collection.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [update-vocaloid-collection]

# 定时事件偶发补投时可能一次涌入多个，只保留最新一个，避免排队被取消
concurrency:
  group: vocaloid-collection
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # 一轮维护约 30 秒，给足余量即可
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      VOCA_USERNAME: ${{ secrets.VOCA_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pywikibot
        run: pip install --disable-pip-version-check pywikibot

      - name: Write user-password.py
        env:
          USER_PASSWORD_PY: ${{ secrets.USER_PASSWORD_PY }}
        run: |
          if [ -z "$USER_PASSWORD_PY" ]; then
            echo "::error::请先在仓库 Secrets 中配置 USER_PASSWORD_PY"
            exit 1
          fi
          printf '%s\n' "$USER_PASSWORD_PY" > user-password.py
          chmod 600 user-password.py

      - name: Restore bot cache
        # data/ 只在 runner 本地存在，缓存起来才能让 stats 的创建者查询接近免费
        uses: actions/cache@v4
        with:
          path: data
          key: voca-creator-cache-${{ github.run_id }}
          restore-keys: voca-creator-cache-

      - name: Run hourly maintenance
        run: |
          # 每次定时触发都完整重算一遍，不靠 recentchanges 决定是否需要运行。
          python bots/vocaloid_collection_contributions.py entries,counts,colour,report,stats --write
