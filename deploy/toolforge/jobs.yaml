# Toolforge 任务定义，用法见 deploy/toolforge/README.md：
#   toolforge jobs load deploy/toolforge/jobs.yaml
#
# command 的路径是相对**工具 home** 的（不是相对仓库目录），所以要写成
# ./Vocawiki-bots/...，否则 job 报 exitcode 127。
#
# 每小时运行一次完整维护。GitHub Actions 在每小时 :47 运行，作为错时的备份。
---
# 单次定时任务，不常驻轮询 recentchanges
- name: hourly
  image: python3.13
  command: ./Vocawiki-bots/deploy/toolforge/run-once.sh
  schedule: "17 * * * *"
  mem: 512Mi
  emails: onfailure

# 每天维护「VOCALOID中文歌词wiki补完计划」清单（AtWiki 歌词页 ↔ voca.wiki 条目比对）。
# 单独一条 job：它要抓上千个 AtWiki 页面、还要读一遍 voca.wiki 的 Songbox，
# 别和每小时的榜单维护挤在一起。第一次跑最慢（几分钟），之后只补新页面。
- name: lyrics-plan
  image: python3.13
  command: ./Vocawiki-bots/deploy/toolforge/run-lyrics-completion.sh
  schedule: "23 4 * * *"
  mem: 512Mi
  emails: onfailure

# 每天维护贡献页 [[User:人间百态/贡献]]：补新条目、去掉重定向 / 消歧义页，
# 歌姬模板只留主模板（不列 Template:IA/2026 这类子模板）。
- name: contributions
  image: python3.13
  command: ./Vocawiki-bots/deploy/toolforge/run-contributions.sh
  schedule: "53 4 * * *"
  mem: 512Mi
  emails: onfailure
