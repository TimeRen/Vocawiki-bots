# Toolforge 任务定义，用法见 deploy/toolforge/README.md：
#   toolforge jobs load deploy/toolforge/jobs.yaml
#
# command 的路径是相对**工具 home** 的（不是相对仓库目录），所以要写成
# ./Vocawiki-bots/...，否则 job 报 exitcode 127。
#
# 每小时运行一次完整维护。GitHub Actions 在每小时 :47 运行，作为错时的备份。
---
# 单次定时任务，不常驻轮询 recentchanges
- name: hourly
  image: python3.13
  command: ./Vocawiki-bots/deploy/toolforge/run-once.sh
  schedule: "17 * * * *"
  mem: 512Mi
  emails: onfailure

# 每天维护「VOCALOID中文歌词wiki补完计划」清单（AtWiki 歌词页 ↔ voca.wiki 条目比对）。
# 单独一条 job：它要抓上千个 AtWiki 页面、还要读一遍 voca.wiki 的 Songbox，
# 别和每小时的榜单维护挤在一起。第一次跑最慢（几分钟），之后只补新页面。
#
# 缓存策略跟 GitHub Actions 不同，两边别写成一样：
# * AtWiki 页面清单 12 小时有效（--max-age 默认值）。这里每天 04:23 跑，间隔 24h
#   一定超过 12h，所以每轮都重建——不会像 Actions 那样一直复用旧清单。
# * 歌名索引 1 小时有效（--index-max-age），旧了先用 list=recentchanges 增量补齐。
# * 本轮算出的「已匹配」比页面上写的少时不写页面（--allow-shrink 才能强写）。
- name: lyrics-plan
  image: python3.13
  command: ./Vocawiki-bots/deploy/toolforge/run-lyrics-completion.sh
  schedule: "23 4 * * *"
  mem: 512Mi
  emails: onfailure

# 每小时维护贡献页 [[User:人间百态/贡献]]：补新条目、去掉重定向 / 消歧义页，
# 歌姬模板只留主模板（不列 Template:IA/2026 这类子模板）。
# 与 hourly（:17）、GitHub Actions（:47）错开。
- name: contributions
  image: python3.13
  command: ./Vocawiki-bots/deploy/toolforge/run-contributions.sh
  schedule: "53 * * * *"
  mem: 512Mi
  emails: onfailure

# 每小时删掉「已经有条目」的歌（--prune-only）：只看站内事实（贡献列表标了已创建、
# 条目存在且 P主 一致），不联网问外站，所以可以比填来源跑得勤。
# 与 hourly（:17）、contributions（:53）、translations（周日 03:37）都错开。
- name: collection-prune
  image: python3.13
  command: ./Vocawiki-bots/deploy/toolforge/run-collection-prune.sh
  schedule: "7 * * * *"
  mem: 512Mi
  emails: onfailure

# 每周填一次 [[User:周某不是轴某/VOCALOID collection搜集库]] 的「翻译来源」一栏
# （只填空格；网易云 / B站 / 巴哈姆特 逐个查）。抓取很慢（一首几秒到十几秒），所以
# 复检定成每周一次，并且带 --refresh：定时器早跑晚跑几十秒也不会漏掉某一周。
# 每一届各有 --limit 80 的预算，十几届互不挤占（2026-10-28：以前是一份全局预算，
# 最后一节 2022秋 永远轮不到）。
# 与 GitHub Actions（周一 06:43）错开。
#
# 2026-10-22 曾暂停过一阵（自动写的三次都被整笔回退，那批来源确实查错了 P主）；
# 修好「每个来源都核对 P主」「只认自己写过的格子」之后已恢复定时。
- name: translations
  image: python3.13
  command: ./Vocawiki-bots/deploy/toolforge/run-collection-translations.sh --limit 80 --refresh
  schedule: "37 3 * * 1"
  mem: 512Mi
  emails: onfailure
