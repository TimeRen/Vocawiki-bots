# Toolforge 任务定义，用法见 deploy/toolforge/README.md：
#   toolforge jobs load deploy/toolforge/jobs.yaml
---
# 常驻监听，近实时维护页面；进程退出后由 Toolforge 自动重启
- name: watcher
  image: python3.13
  command: ./deploy/toolforge/watch.sh
  continuous: true
  mem: 512Mi
  emails: onfailure

# 兜底：每小时再整体跑一轮（图表重算、计数、上色、异常报告）
- name: hourly
  image: python3.13
  command: ./deploy/toolforge/run-once.sh
  schedule: "@hourly"
  timeout: 3600
  mem: 512Mi
  emails: onfailure
